# Docker setup: nginx round-robins across the stateless app servers and retries another one if one fails.
events { worker_connections 4096; }
http {
  upstream shortener {
    least_conn;
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    server app3:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://shortener;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
