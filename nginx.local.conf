# Local setup (use with scripts/cluster.js): nginx on :8080 in front of apps on :3001-3003.
events { worker_connections 4096; }
http {
  upstream shortener {
    least_conn;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3003 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://shortener;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
